name: ffmpeg
title: FFmpeg
summary: Converts, filters and streams audio and video. Built from the signed FFmpeg release, with x264, x265, VP9, AV1, Opus, MP3 and subtitle rendering.
homepage: https://ffmpeg.org/
license: GPL-3.0-or-later AND MPL-2.0 AND BSD-3-Clause AND Zlib AND Unlicense
source-release: true
upstream:
  source: github-tag
  repository: FFmpeg/FFmpeg
  tag-pattern: '^n(\d+\.\d+(?:\.\d+)?)$'
  version-template: '{1}'
  versioning: semver
  version: 9.0.2
  artifact:
    url: https://ffmpeg.org/releases/ffmpeg-{version}.tar.xz
    signature: https://ffmpeg.org/releases/ffmpeg-{version}.tar.xz.asc
    sha256: 8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e
  # SRT support. Alpine's libsrt package, and Ubuntu's outside Ubuntu Pro, lack
  # upstream security fixes, so libsrt is compiled from its release tag.
  # Upstream attaches no source tarball to its releases: this is GitHub's
  # archive of the tag, whose files were compared with the tagged commit
  # before the hash was pinned.
  extra-artifacts:
    libsrt:
      version: 1.5.7
      url: https://github.com/Haivision/srt/archive/refs/tags/v{version}.tar.gz
      sha256: 017cd1e437ef2073a4dd10ddf7b55e86bc3d6ebac0393d13bd22f6a57055d32b
image:
  entrypoint: [ffmpeg]
  cmd: [-version]
test:
  - |
    ffmpeg -hide_banner -version > version.txt
    head -n 1 version.txt | grep -Fq "ffmpeg version $VERSION "
    ffprobe -hide_banner -version | head -n 1 | grep -Fq "ffprobe version $VERSION "
  - |
    ffmpeg -hide_banner -buildconf > buildconf.txt
    grep -Fq -- --enable-gpl buildconf.txt
    grep -Fq -- --enable-version3 buildconf.txt
    if grep -Fq -- --enable-nonfree buildconf.txt; then echo "nonfree build" >&2; exit 1; fi
  - |
    for f in /usr/local/bin/ffmpeg /usr/local/bin/ffprobe /usr/local/lib/lib*.so.*; do
      test -e "$f"
      ldd "$f" > ldd.txt 2>&1 || true
      if grep -Eq 'not found|Error loading shared library|Error relocating' ldd.txt; then
        echo "$f:" >&2
        cat ldd.txt >&2
        exit 1
      fi
    done
  - |
    test -s /etc/ssl/certs/ca-certificates.crt
    ffmpeg -hide_banner -encoders > encoders.txt
    for e in libx264 libx265 libvpx-vp9 libaom-av1 libsvtav1 libopus libmp3lame libvorbis libtheora libwebp; do
      grep -qw -- "$e" encoders.txt || { echo "missing encoder: $e" >&2; exit 1; }
    done
    ffmpeg -hide_banner -decoders > decoders.txt
    grep -qw libdav1d decoders.txt
    ffmpeg -hide_banner -filters > filters.txt
    for f in ass drawtext subtitles vidstabdetect zmq zscale; do
      grep -qw -- "$f" filters.txt || { echo "missing filter: $f" >&2; exit 1; }
    done
    ffmpeg -hide_banner -protocols > protocols.txt
    for p in bluray https srt tls; do
      grep -qw -- "$p" protocols.txt || { echo "missing protocol: $p" >&2; exit 1; }
    done
    ffmpeg -hide_banner -demuxers > demuxers.txt
    grep -qw dash demuxers.txt
    ffmpeg -hide_banner -hwaccels > hwaccels.txt
    grep -qw vaapi hwaccels.txt
  - |
    export SVT_LOG=1
    run() { ffmpeg -hide_banner -loglevel error -y "$@"; }
    v=testsrc2=size=320x240:rate=25:duration=1
    a=sine=frequency=1000:duration=1
    run -f lavfi -i "$v" -f lavfi -i "$a" -c:v libx264 -c:a aac h264.mp4
    run -f lavfi -i "$v" -f lavfi -i "$a" -c:v libvpx-vp9 -deadline realtime -cpu-used 8 -c:a libopus vp9.webm
    run -f lavfi -i "$v" -c:v libx265 -x265-params log-level=error hevc.mkv
    run -f lavfi -i "$v" -frames:v 2 -c:v libaom-av1 -cpu-used 8 aom.mkv
    run -f lavfi -i "$v" -frames:v 2 -c:v libsvtav1 -preset 8 svt.mkv
    run -f lavfi -i "$v" -frames:v 1 -c:v libwebp frame.webp
    run -f lavfi -i "$a" -c:a libmp3lame audio.mp3
    run -f lavfi -i "$a" -af aresample=48000:resampler=soxr -c:a libvorbis audio.ogg
    run -c:v libdav1d -i aom.mkv -f null -
    for pair in h264.mp4:h264 vp9.webm:vp9 hevc.mkv:hevc aom.mkv:av1 svt.mkv:av1 frame.webp:webp; do
      codec="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "${pair%%:*}")"
      [ "$codec" = "${pair#*:}" ] || { echo "${pair%%:*}: expected ${pair#*:}, got $codec" >&2; exit 1; }
    done
  - |
    printf '1\n00:00:00,000 --> 00:00:01,000\nsubtitle\n' > subs.srt
    ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=black:size=320x240:duration=1 \
      -vf "drawtext=text=ok:fontsize=24:fontcolor=white,subtitles=subs.srt,zscale=w=160:h=120" \
      -frames:v 1 text.png 2> text.log
    if [ -s text.log ]; then cat text.log >&2; exit 1; fi
    test -s text.png
  - |
    set -- /usr/local/lib/libavformat.so.*
    ldd "$1" > avformat-ldd.txt
    srt="$(awk '$1 ~ /^libsrt\.so\./ { print $3 }' avformat-ldd.txt)"
    case "$srt" in
      /usr/local/lib/libsrt.so.*) ;;
      *) cat avformat-ldd.txt >&2; echo "expected libavformat to load libsrt from /usr/local/lib, got '$srt'" >&2; exit 1 ;;
    esac
    # 1.5.6 fixed CVE-2026-55868 and CVE-2026-55869.
    v="$(readlink -f "$srt")"
    v="${v##*/libsrt.so.}"
    if ! echo "$v" | awk -F. '{ exit !($1 > 1 || ($1 == 1 && ($2 > 5 || ($2 == 5 && $3 >= 6)))) }'; then
      echo "expected libsrt 1.5.6 or later, got '$v'" >&2
      exit 1
    fi
    url='srt://127.0.0.1:9000?passphrase=0123456789abcdef&pbkeylen=32'
    ffmpeg -hide_banner -loglevel error -y -f mpegts -i "$url&mode=listener&listen_timeout=30000000&timeout=10000000" \
      -c copy srt.ts 2> srt-rx.log &
    rx=$!
    sent=
    for _ in 1 2 3 4 5; do
      if ffmpeg -hide_banner -loglevel error -re -f lavfi -i testsrc2=size=320x240:rate=25:duration=2 \
        -c:v libx264 -tune zerolatency -f mpegts "$url&linger=5" 2> srt-tx.log; then
        sent=1
        break
      fi
      sleep 1
    done
    wait "$rx" || :
    if [ -z "$sent" ]; then cat srt-rx.log srt-tx.log >&2; echo "sending over SRT failed" >&2; exit 1; fi
    if [ ! -s srt.ts ]; then cat srt-rx.log >&2; echo "the SRT listener wrote nothing to srt.ts" >&2; exit 1; fi
    # ffprobe lists an MPEG-TS stream twice, under its program and on its own.
    codec="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 srt.ts | awk 'NF { print; exit }')"
    frames="$(ffprobe -v error -select_streams v:0 -count_packets -show_entries stream=nb_read_packets -of csv=p=0 srt.ts | awk 'NF { print; exit }')"
    case "$frames" in ''|*[!0-9]*) n=0 ;; *) n=$frames ;; esac
    if [ "$codec" != h264 ] || [ "$n" -lt 25 ]; then
      cat srt-rx.log >&2
      echo "srt.ts: expected h264 with at least 25 of 50 frames, got '$codec' with '$frames'" >&2
      exit 1
    fi
examples:
  - title: Convert a video to H.264 and AAC in an MP4 file
    command: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" ghcr.io/randomcontainers/ffmpeg -i input.mkv -c:v libx264 -crf 23 -c:a aac output.mp4
  - title: Encode a video to AV1 with SVT-AV1 and Opus
    command: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" ghcr.io/randomcontainers/ffmpeg -i input.mp4 -c:v libsvtav1 -preset 8 -crf 35 -c:a libopus output.webm
  - title: Show the streams in a file with ffprobe
    command: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" --entrypoint ffprobe ghcr.io/randomcontainers/ffmpeg -hide_banner input.mp4
